name: HEB validation (DuckDB, RAG, LLM)
on:
  pull_request:
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/heb-duckdb-ci.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build offline policy index for chat contract tests
        run: python -m app.rag build --pdf-dir candidatos/politicas --index-dir data/rag_index --embeddings off

      - name: Run all automated tests (LLM tests use a simulated Ollama; real-model tests stay skipped)
        run: python -m pytest tests -q -rs

      - name: Reproduce three analytical demo answers
        run: python scripts/demo_analytics.py
