name: HEB DuckDB validation
on:
  pull_request:
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/heb-duckdb-ci.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify backend and RAG tests
        run: python -m pytest tests/backend tests/rag -q
